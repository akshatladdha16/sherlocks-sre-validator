[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-bench"
version = "0.1.0"
description = "Eval harness for agentic SRE incident diagnosis"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "langchain>=0.2,<0.3",
  "langchain-openai>=0.1,<0.2",
  "langchain-anthropic>=0.1,<0.2",
  "crewai>=0.55",
  "openai>=1.30",
  "anthropic>=0.28",
  "jinja2>=3.1",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.scripts]
sre-bench = "sre_bench.runner:app"
